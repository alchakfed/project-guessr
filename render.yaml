# render.yaml — Render Blueprint for ProjectGuessr (multiplayer web app).
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and pick your repo. Render reads this file and creates
# the service below. WebSockets work out of the box on Render web services.
#
# The free plan spins the instance down after ~15 min idle; the next visit takes
# ~30-60s to wake it. Upgrade the plan if you want it always-on.
services:
  - type: web
    name: projectguessr
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm install
    startCommand: node server.js
    # server.js already reads process.env.PORT, which Render sets automatically.
    envVars:
      - key: NODE_VERSION
        value: "20"
